<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsuranceRAG – Insurance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#12332E; --pine-2:#1A4740; --mist:#EEF3F1; --paper:#FBFCFA;
  --ink:#16221F; --muted:#5E716C; --teal:#1F8A70; --saffron:#F2B632; --line:#D6E0DC; --err:#B3392F;
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--mist:#0D1917; --paper:#13231F; --ink:#E6EFEC; --muted:#93A8A2; --line:#26403A; --pine:#0A1F1B; --pine-2:#143A33}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--mist);color:var(--ink);display:grid;grid-template-columns:280px 1fr;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* sidebar */
aside{background:var(--pine);color:#E3EFEB;padding:28px 22px;display:flex;flex-direction:column;gap:26px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo{width:38px;height:38px}
.logo path.shield{fill:var(--saffron)}
.logo path.tick{stroke:var(--pine);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw 1.1s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
aside h3{font-family:var(--head);font-weight:500;font-size:14px;color:#9FBDB5;margin-bottom:10px}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{text-align:left;padding:11px 13px;border-radius:10px;background:var(--pine-2);font-size:15px;line-height:1.35;transition:transform .2s,background .2s}
.suggest button:hover{background:#21594F;transform:translateX(4px)}
.side-foot{margin-top:auto;font-size:13px;color:#9FBDB5;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#777;transition:background .3s}
.dot.ok{background:#4ADE9A;box-shadow:0 0 0 0 #4ADE9A88;animation:pulse 2s infinite}
.dot.bad{background:var(--err)}
@keyframes pulse{70%{box-shadow:0 0 0 8px #4ADE9A00}100%{box-shadow:0 0 0 0 #4ADE9A00}}
.reset{padding:10px 13px;border:1px solid #2E5A51;border-radius:10px;font-size:14px;transition:background .2s}
.reset:hover{background:var(--pine-2)}

/* main */
main{display:flex;flex-direction:column;height:100vh;min-width:0}
header.top{padding:18px 32px;border-bottom:1px solid var(--line);font-family:var(--head);display:flex;justify-content:space-between;align-items:center}
header.top b{font-weight:700;font-size:18px}
header.top span{font-size:14px;color:var(--muted)}
#feed{flex:1;overflow-y:auto;padding:28px 32px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.inner{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.welcome{margin:auto;text-align:left;max-width:560px}
.welcome h1{font-family:var(--head);font-size:clamp(30px,4.4vw,46px);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
.welcome h1 .w{display:inline-block;opacity:0;transform:translateY(14px);animation:rise .6s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.welcome p{color:var(--muted);font-size:18px;line-height:1.55}

.msg{display:flex;flex-direction:column;gap:8px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-items:flex-end}
.bubble{max-width:88%;padding:13px 17px;border-radius:16px;font-size:18px;line-height:1.6}
.user .bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px;font-family:var(--head);font-size:16px;font-weight:500}
.bot .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:100%}
.bot .bubble p+p,.bot .bubble ul{margin-top:10px}
.bot .bubble ul{padding-left:22px}
.bot .bubble.err{border-color:var(--err);color:var(--err)}
.caret::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--teal);margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* sources */
.sources{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.src{border:1px solid var(--line);background:var(--paper);border-radius:10px;font-family:var(--head);font-size:13px;overflow:hidden;max-width:100%;
     border-left:4px solid var(--saffron);animation:slide .45s ease backwards}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
.src button{padding:8px 12px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}
.src .chev{transition:transform .25s;margin-left:auto}
.src.open .chev{transform:rotate(90deg)}
.src .snip{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.src.open .snip{grid-template-rows:1fr}
.src .snip div{overflow:hidden}
.src .snip p{padding:0 12px 12px;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--muted);max-width:620px}

/* thinking */
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--head);font-size:14px}
.scan{width:34px;height:42px;border:2px solid var(--teal);border-radius:5px;position:relative;overflow:hidden;background:var(--paper)}
.scan::before,.scan::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--line);box-shadow:0 7px 0 var(--line),0 14px 0 var(--line),0 21px 0 var(--line);top:8px}
.scan::after{box-shadow:none;left:0;right:0;top:0;height:6px;background:var(--saffron);opacity:.85;animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{to{top:34px}}

/* composer */
form{padding:14px 32px 22px}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 18px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px #1F8A7022}
textarea{flex:1;border:0;outline:0;background:none;resize:none;font:inherit;font-size:18px;color:var(--ink);max-height:140px;padding:6px 0;line-height:1.45}
.send{width:44px;height:44px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;transition:transform .2s,opacity .2s}
.send:hover:not(:disabled){transform:scale(1.07) rotate(-6deg)}
.send:disabled{opacity:.4;cursor:not-allowed}
.hint{max-width:760px;margin:8px auto 0;font-size:13px;color:var(--muted);font-family:var(--head)}

@media (max-width:820px){
  body{grid-template-columns:1fr}
  aside{display:none}
  #feed,form,header.top{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path class="shield" d="M20 2 35 8v11c0 9-6.5 16-15 19C11.500 35 5 28 5 19V8z"/><path class="tick" d="M12.500 20.500 18 26l10-11"/></svg>
    InsuranceRAG
  </div>
  <div>
    <h3>Try asking</h3>
    <div class="suggest" id="suggest">
      <button>What does my policy cover for hospitalization?</button>
      <button>How do I file a claim?</button>
      <button>What are the exclusions I should know about?</button>
      <button>What is the waiting period for pre-existing conditions?</button>
    </div>
  </div>
  <button class="reset" id="reset">New conversation</button>
  <div class="side-foot"><span class="dot" id="dot"></span><span id="status">Checking backend…</span></div>
</aside>

<main>
  <header class="top"><b>Policy assistant</b><span>Answers come from your policy documents</span></header>
  <div id="feed"><div class="inner" id="inner">
    <div class="welcome" id="welcome">
      <h1 id="h1"></h1>
      <p>Ask about coverage, claims, exclusions or waiting periods. Every answer shows the policy clauses it was drawn from.</p>
    </div>
  </div></div>
  <form id="form">
    <div class="box">
      <textarea id="q" rows="1" placeholder="Ask about your policy…" aria-label="Your question"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send question" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </form>
</main>

<script>
/* ===== INTEGRATION SETTINGS ===== */
const CONFIG = {
  API_URL: "/api/chat",        // POST {question, session_id} -> {answer, sources:[{title,page,snippet}]}
  HEALTH_URL: "/api/health",   // GET -> 200 when backend is up
  QUESTION_FIELD: "question",  // rename if your backend expects another key
  TYPE_SPEED: 12               // ms per character for the reveal (0 = instant)
};
/* ================================ */

const $ = s => document.querySelector(s);
const feed = $("#feed"), inner = $("#inner"), q = $("#q"), send = $("#send");
let sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
let busy = false;

// headline words rise in once on load
"Ask anything about your coverage.".split(" ").forEach((w,i)=>{
  const s=document.createElement("span"); s.className="w"; s.textContent=w+" "; s.style.animationDelay=(0.15+i*0.09)+"s"; $("#h1").appendChild(s);
});

const esc = t => t.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  const lines = esc(t).split(/\n/); let html="", inList=false;
  for(const l of lines){
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(li){ if(!inList){html+="<ul>";inList=true} html+="<li>"+inline(li[1])+"</li>"; }
    else { if(inList){html+="</ul>";inList=false} if(l.trim()) html+="<p>"+inline(l)+"</p>"; }
  }
  return html+(inList?"</ul>":"");
}
const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");

function add(role, node){
  $("#welcome")?.remove();
  const m=document.createElement("div"); m.className="msg "+role; m.appendChild(node); inner.appendChild(m);
  feed.scrollTop=feed.scrollHeight; return m;
}
const bubble = (html,cls="") => { const b=document.createElement("div"); b.className="bubble "+cls; b.innerHTML=html; return b; };

function thinking(){
  const d=document.createElement("div"); d.className="thinking";
  d.innerHTML='<div class="scan"></div><span>Searching your policy documents…</span>'; return d;
}

function renderSources(list, host){
  if(!list||!list.length) return;
  const wrap=document.createElement("div"); wrap.className="sources";
  list.forEach((s,i)=>{
    const title = s.title || s.source || s.file || "Policy document";
    const page = s.page!=null ? " · p."+s.page : "";
    const snip = s.snippet || s.text || s.content || "";
    const el=document.createElement("div"); el.className="src"; el.style.animationDelay=(i*90)+"ms";
    el.innerHTML=`<button aria-expanded="false"><span>${esc(String(title))}${page}</span>${snip?'<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg>':""}</button>${snip?`<div class="snip"><div><p>${esc(String(snip))}</p></div></div>`:""}`;
    if(snip) el.querySelector("button").onclick=e=>{ const o=el.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",o); };
    wrap.appendChild(el);
  });
  host.appendChild(wrap); feed.scrollTop=feed.scrollHeight;
}

async function reveal(el, text){
  if(!CONFIG.TYPE_SPEED){ el.innerHTML=md(text); return; }
  el.classList.add("caret"); let i=0;
  const step=Math.max(1,Math.ceil(text.length/260));
  await new Promise(res=>{ const t=setInterval(()=>{
    i=Math.min(text.length,i+step); el.innerHTML=md(text.slice(0,i)); feed.scrollTop=feed.scrollHeight;
    if(i>=text.length){clearInterval(t);res()}
  },CONFIG.TYPE_SPEED*step/2);});
  el.classList.remove("caret"); el.innerHTML=md(text);
}

async function ask(text){
  if(busy||!text.trim()) return; busy=true; send.disabled=true;
  add("user", bubble(esc(text)));
  const wait=add("bot", thinking());
  try{
    const res = await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({[CONFIG.QUESTION_FIELD]:text, session_id:sessionId})});
    if(!res.ok) throw new Error("Server returned "+res.status);
    const data = await res.json();
    const answer = data.answer ?? data.response ?? data.result ?? "";
    const b=bubble(""); wait.replaceChildren(b);
    await reveal(b, answer || "The backend returned no answer.");
    renderSources(data.sources||data.citations||[], wait);
  }catch(e){
    wait.replaceChildren(bubble("Couldn't reach the assistant. Check that the backend is running and that <code>API_URL</code> in this file matches it. ("+esc(e.message)+")","err"));
  }
  busy=false; send.disabled=!q.value.trim(); q.focus();
}

$("#form").addEventListener("submit",e=>{e.preventDefault(); const t=q.value; q.value=""; grow(); ask(t);});
q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); $("#form").requestSubmit();}});
const grow=()=>{q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,140)+"px"; send.disabled=busy||!q.value.trim();};
q.addEventListener("input",grow);
$("#suggest").addEventListener("click",e=>{ if(e.target.tagName==="BUTTON") ask(e.target.textContent); });
$("#reset").onclick=()=>{ if(busy) return; sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now()); location.reload(); };

fetch(CONFIG.HEALTH_URL).then(r=>{ if(!r.ok) throw 0; $("#dot").className="dot ok"; $("#status").textContent="Backend connected"; })
  .catch(()=>{ $("#dot").className="dot bad"; $("#status").textContent="Backend not reachable"; });
</script>
</body>
</html>
